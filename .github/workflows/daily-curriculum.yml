name: Daily Curriculum Shards

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_course:
        description: 'Target course ID (e.g. "all", "ja", "de", "ko")'
        required: true
        default: 'all'
        type: string
      units_per_course:
        description: 'Units per course to generate'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'

permissions:
  contents: write

concurrency:
  group: curriculum-data-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare curriculum-data worktree
        run: |
          if git ls-remote --exit-code --heads origin curriculum-data >/dev/null 2>&1; then
            git fetch origin curriculum-data:curriculum-data
            git worktree add .curriculum-worktree curriculum-data
          else
            git worktree add --detach .curriculum-worktree
            (
              cd .curriculum-worktree
              git checkout --orphan curriculum-data
              git rm -rf . >/dev/null 2>&1 || true
              cp -R ../curriculum ./curriculum
              git config user.name "${{ github.repository_owner }}"
              git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
              git add curriculum
              git commit -m "seed initial curriculum-data branch"
            )
          fi

      - name: Generate next sequential unit shards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CURRICULUM_DIR: .curriculum-worktree/curriculum
          INPUT_TARGET_COURSE: ${{ inputs.target_course || 'all' }}
          INPUT_UNITS_PER_COURSE: ${{ inputs.units_per_course || '1' }}
        run: npm run curriculum:generate

      - name: Validate curriculum-data shards and hashes
        env:
          CURRICULUM_DIR: .curriculum-worktree/curriculum
        run: npm run curriculum:validate

      - name: Commit and push to curriculum-data
        run: |
          cd .curriculum-worktree
          git add curriculum
          if [ -z "$(git status --porcelain curriculum)" ]; then
            echo "No curriculum changes to publish."
          else
            git config user.name "${{ github.repository_owner }}"
            git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
            git commit -m "publish daily curriculum shards"
          fi
          git push origin curriculum-data
